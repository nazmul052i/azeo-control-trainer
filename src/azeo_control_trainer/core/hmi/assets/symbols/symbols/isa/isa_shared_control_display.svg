<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"
     viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">ISA shared control display</title>
  <desc id="desc">Instrument bubble inside a square with TI and tag number placeholders.</desc>
  <style id="symbol-theme" type="text/css">
    /* Edit these values to restyle this symbol. */
    .symbol-line { stroke: #000000; stroke-width: 1.5; stroke-opacity: 1; }
    .symbol-fill { fill: #ffffff; fill-opacity: 1; }
    .symbol-solid { fill: #000000; fill-opacity: 1; }
    .symbol-text { fill: #000000; fill-opacity: 1; }
    .connection-port { display: none; fill: #ffffff; stroke: #2563eb;
      stroke-width: 1.5; pointer-events: all; cursor: crosshair; }
  </style>
  <g class="symbol-fill symbol-line"
     shape-rendering="geometricPrecision">
    <rect x="7" y="7" width="50" height="50"/>
    <circle cx="32" cy="32" r="25"/>
    <path d="M7 32H57" fill="none"/>
  </g>
  <g class="symbol-text" font-family="sans-serif"
     font-size="12" text-anchor="middle">
    <text x="32" y="27">TI</text>
    <text x="32" y="47">##</text>
  </g>
  <g class="connection-points" data-role="connection-points" aria-hidden="true">
    <circle class="connection-port" data-connection-side="top"
            data-anchor-x="0.5" data-anchor-y="0.109375" cx="32" cy="7" r="3"/>
    <circle class="connection-port" data-connection-side="right"
            data-anchor-x="0.890625" data-anchor-y="0.5" cx="57" cy="32" r="3"/>
    <circle class="connection-port" data-connection-side="bottom"
            data-anchor-x="0.5" data-anchor-y="0.890625" cx="32" cy="57" r="3"/>
    <circle class="connection-port" data-connection-side="left"
            data-anchor-x="0.109375" data-anchor-y="0.5" cx="7" cy="32" r="3"/>
  </g>
</svg>
