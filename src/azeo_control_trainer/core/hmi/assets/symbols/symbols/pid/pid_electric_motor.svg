<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108" role="img" aria-labelledby="title desc">
  <title id="title">P&amp;ID electric motor</title>
  <desc id="desc">Circular electric-motor symbol labelled M.</desc>
  <style id="symbol-theme" type="text/css">/* Edit these values to restyle this symbol. */
.symbol-line {
  stroke: #000000;
  stroke-width: 1;
  stroke-opacity: 1;
}
.symbol-fill {
  fill: #ffffff;
  fill-opacity: 1;
}
.symbol-solid {
  fill: #000000;
  fill-opacity: 1;
}
.symbol-text {
  fill: #000000;
  fill-opacity: 1;
}
.connection-port {
  display: none;
  fill: #ffffff;
  stroke: #2563eb;
  stroke-width: 1.5;
  pointer-events: all;
  cursor: crosshair;
}
</style>
  <g transform="translate(-612 -12)" shape-rendering="geometricPrecision">
    <g>
      <g transform="translate(0.5,0.5)">
        <ellipse cx="666" cy="66" rx="50" ry="50" class="symbol-fill symbol-line" />
      </g>
    </g>
    <text x="666" y="81" class="symbol-text" font-family="Arial" font-size="45" text-anchor="middle">M</text>
  </g>
  <g class="connection-points" data-role="connection-points" aria-hidden="true">
    <circle class="connection-port" data-connection-side="top" data-anchor-x="0.50463" data-anchor-y="0.0416667" cx="54.5" cy="4.5" r="3" />
    <circle class="connection-port" data-connection-side="right" data-anchor-x="0.967593" data-anchor-y="0.50463" cx="104.5" cy="54.5" r="3" />
    <circle class="connection-port" data-connection-side="bottom" data-anchor-x="0.50463" data-anchor-y="0.967593" cx="54.5" cy="104.5" r="3" />
    <circle class="connection-port" data-connection-side="left" data-anchor-x="0.0416667" data-anchor-y="0.50463" cx="4.5" cy="54.5" r="3" />
  </g>
