<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="58" height="108" viewBox="0 0 58 108" role="img" aria-labelledby="title desc">
  <title id="title">P&amp;ID controller indicator</title>
  <desc id="desc">Instrument bubble inside a square with a downward connection stem.</desc>
  <style id="symbol-theme" type="text/css">/* Edit these values to restyle this symbol. */
.symbol-line {
  stroke: #000000;
  stroke-width: 1;
  stroke-opacity: 1;
}
.symbol-fill {
  fill: #ffffff;
  fill-opacity: 1;
}
.symbol-solid {
  fill: #000000;
  fill-opacity: 1;
}
.symbol-text {
  fill: #000000;
  fill-opacity: 1;
}
.connection-port {
  display: none;
  fill: #ffffff;
  stroke: #2563eb;
  stroke-width: 1.5;
  pointer-events: all;
  cursor: crosshair;
}
</style>
  <g transform="translate(-122 -412)" shape-rendering="geometricPrecision">
