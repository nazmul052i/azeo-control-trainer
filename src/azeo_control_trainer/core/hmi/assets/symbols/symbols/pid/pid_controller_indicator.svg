        <path d="M 126 441 L 176 441" fill="none" stroke-miterlimit="10" class="symbol-line" />
      </g>
    </g>
    <text x="151" y="436" class="symbol-text" font-family="Arial" font-size="12" text-anchor="middle">TI</text>
    <text x="151" y="456" class="symbol-text" font-family="Arial" font-size="12" text-anchor="middle">##</text>
  </g>
