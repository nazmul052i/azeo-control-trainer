<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-labelledby="title desc">
  <title id="title">P&amp;ID flow splitter</title>
  <desc id="desc">Hand-authored for AzeoPlant following the symbol library contract: one inlet split to two outlets.</desc>
  <style id="symbol-theme" type="text/css">/* Edit these values to restyle this symbol. */
.symbol-line {
  stroke: #24407C;
  stroke-width: 1;
  stroke-opacity: 1;
}
.symbol-fill {
  fill: #F8FAFD;
  fill-opacity: 1;
}
.symbol-solid {
  fill: #24407C;
  fill-opacity: 1;
}
.symbol-text {
  fill: #24407C;
  fill-opacity: 1;
}
.connection-port {
  display: none;
  fill: #ffffff;
  stroke: #2563eb;
  stroke-width: 1.5;
  pointer-events: all;
  cursor: crosshair;
}
</style>
  <g shape-rendering="geometricPrecision">
    <path d="M 2 24 L 10 24" fill="none" class="symbol-line" />
    <path d="M 10 24 L 40 10 L 40 38 Z" class="symbol-fill symbol-line" />
    <path d="M 40 10 L 46 10 M 40 38 L 46 38" fill="none" class="symbol-line" />
  </g>
  <g class="connection-points" data-role="connection-points" aria-hidden="true">
    <circle class="connection-port" data-connection-side="top" data-anchor-x="0.958333" data-anchor-y="0.208333" data-connection-normal="right" cx="46" cy="10" r="3" />
    <circle class="connection-port" data-connection-side="right" data-anchor-x="0.833333" data-anchor-y="0.5" cx="40" cy="24" r="3" />
    <circle class="connection-port" data-connection-side="bottom" data-anchor-x="0.958333" data-anchor-y="0.791667" data-connection-normal="right" cx="46" cy="38" r="3" />
    <circle class="connection-port" data-connection-side="left" data-anchor-x="0.041667" data-anchor-y="0.5" cx="2" cy="24" r="3" />
  </g>
</svg>
