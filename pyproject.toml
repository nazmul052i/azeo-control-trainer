[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azeo-control-trainer"
version = "0.4.0"
description = "Azeo process-control engineering, graphics, operation, and simulation suite"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "anyio>=4.14.2,<5",
    "numpy>=1.24",
    "PySide6-Essentials>=6.6",
    "pyqtgraph>=0.13",
    "pydantic>=2.12,<3",
    "PyYAML>=6,<7",
    "cryptography>=42",
    "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
native = ["pybind11>=3.0", "cmake>=3.24", "ninja"]
opcua = ["asyncua>=1.0"]
configuration = ["psycopg[binary,pool]>=3.2,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
windows = ["packaging>=24", "PyYAML>=6", "scipy>=1.14", "psutil>=6",
           "asyncua>=1.0", "pymodbus>=3.8", "psycopg[binary,pool]>=3.2,<4",
           "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=7.0", "pytest-timeout>=2.1", "black>=23.0", "ruff>=0.1"]

[project.scripts]
azeo = "azeo_control_trainer.app:main"
azeo-explorer = "azeo_control_trainer.azeo_explorer:main"
azeo-control-designer = "azeo_control_trainer.azeo_control_designer:main"
azeo-graphics-designer = "azeo_control_trainer.azeo_graphics_designer:main"
azeo-operator-station = "azeo_control_trainer.azeo_operator_station:main"
azeo-simulation-workbench = "azeo_control_trainer.azeo_simulation_workbench:main"
azeo-pa-designer = "azeo_control_trainer.azeo_pa_designer:main"
azeo-export-hmi = "azeo_control_trainer.core.hmi.integration.control_designer_cli:main"
azeo-configuration = "azeo_control_trainer.services.configuration.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["azeo_control_trainer*"]

[tool.setuptools.package-data]
"azeo_control_trainer.core.presentation" = ["assets/*.svg"]
"azeo_control_trainer.azeo_pa_designer" = ["CANVAS_SOURCE.json"]
"azeo_control_trainer.core.pa_designer" = ["library/definitions/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "_smoke_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
